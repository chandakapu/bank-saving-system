name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Lint Frontend
        run: |
          cd bank-saving-system/frontend
          npm install
          npm run lint

  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bank_saving_system
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Initialize Database
        run: |
          mysql -h 127.0.0.1 -u root -proot bank_saving_system < bank-saving-system/database/migrations/migrations.sql

      - name: Run Backend API Tests
        run: |
          cd bank-saving-system/backend
          npm install
          # Start server in background
          DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASSWORD=root DB_NAME=bank_saving_system PORT=3000 npm run start &
          # Wait for server to be ready
          sleep 5
          # Run bash test script
          bash test-api.sh
