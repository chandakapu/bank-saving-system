name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Check Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bank_saving_system
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Initialize Database
        run: |
          mysql -h 127.0.0.1 -u root -proot bank_saving_system < database/migrations/migrations.sql

      - name: Run Backend Tests
        run: |
          cd backend
          npm ci
          TEST_DATABASE=1 \
          TEST_DB_HOST=127.0.0.1 \
          TEST_DB_PORT=3306 \
          TEST_DB_USER=root \
          TEST_DB_PASSWORD=root \
          TEST_DB_NAME=bank_saving_system \
          npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build -t bank-saving-backend ./backend
          docker build -t bank-saving-frontend ./frontend
