services:
  db:
    image: mysql:8.0
    container_name: bank-system-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-bank_saving_system}
      MYSQL_USER: ${DB_USER:-bank_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./database/migrations/migrations.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bank-system-backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-bank_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-bank_saving_system}
      DB_SSL: "false"
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_ROTATE_PASSWORD: ${ADMIN_ROTATE_PASSWORD:-false}
      CORS_ORIGINS: http://localhost
      COOKIE_SECURE: "false"
      TRUST_PROXY_HOPS: 1
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bank-system-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
